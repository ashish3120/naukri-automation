name: Naukri Profile Refresh (Every 4 Hours)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: naukri-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Google Chrome & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install npm dependencies
        run: npm install

      - name: Restore Session (.naukri-chrome-profile and .env)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "::error::SESSION_SECRET secret is missing! Please configure it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          node unpack-session.js "$SESSION_SECRET"

      - name: Run Naukri Profile Refresh
        run: |
          xvfb-run --server-args="-screen 0 1280x800x24" node naukri-profile-refresh.js --show

      - name: Upload Logs and Screenshot on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-and-screenshots
          path: |
            naukri-refresh.log
            naukri-refresh-error-*.png
          if-no-files-found: ignore
